# Development profile — active local settings
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/property_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 30000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USERNAME:admin}
        login-password: ${DRUID_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.property: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    com.alibaba.druid: DEBUG
