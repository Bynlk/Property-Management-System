# Production profile — strict logging, performance tuning
server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/property_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 50
      max-wait: 60000
      # Disable Druid stat view in production
      stat-view-servlet:
        enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost}

# Disable Swagger UI in production
springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    com.property: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    com.alibaba.druid: WARN
    root: WARN
