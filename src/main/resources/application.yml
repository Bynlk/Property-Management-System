server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: property-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/property_management?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.property.entity
  configuration:
    map-underscore-to-camel-case: true
    # 枚举类型处理：使用自定义 CodeEnumTypeHandler，存储中文值到数据库
    default-enum-type-handler: com.property.enums.CodeEnumTypeHandler

jwt:
  # 必须通过环境变量 JWT_SECRET 设置随机密钥
  # 可使用命令生成: openssl rand -base64 32
  # 生产环境务必设置此变量，否则应用启动将失败
  secret: ${JWT_SECRET}
  expiration: 86400000

# CORS 配置（逗号分隔多个源）
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

# Swagger/OpenAPI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 日志配置
logging:
  level:
    com.property: INFO
    org.springframework.security: WARN

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
